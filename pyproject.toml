[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dba-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "slack_sdk>=3.33",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "oracledb>=2.0",
    "cffi>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "testcontainers>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real (or testcontainers-provided) database engine"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
