[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dba-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "slack_sdk>=3.33",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "oracledb>=2.0",
    "cffi>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "testcontainers>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real (or testcontainers-provided) database engine",
    "llm_live: needs a real, billed LLM API call (ANTHROPIC_API_KEY) -- distinct from 'integration' because the gating condition is a paid external API, not a local/testcontainers database; skips cleanly without a usable key, same as 'integration' skips cleanly without Docker",
]
addopts = "-m 'not integration and not llm_live'"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
